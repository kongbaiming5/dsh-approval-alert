# dsh-approval-alert 的 bundle patch。
#
# 这是 bundle 层：安装并被 profile 选中后，DSH 会插入 approval-alert 行。
# 不需要再手动把这段复制到 profile 的 cordis.patch.yml。
- insert:
    - id: approval-alert
      name: dsh-approval-alert
      config:
        enabled: true
        sound: Glass
        volume: 1
        burst: 2
        alertOnApproval: true
        alertOnQuestions: true
        watchSystemPrompts: true
        systemPromptTimeoutMs: 600000
        watchPrivilegePrompts: true
        privilegePromptTimeoutMs: 180000
        notify: true
        startupChime: false
        locale: zh
        traceFile: ""
